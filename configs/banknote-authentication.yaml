kmeans:
  n_clusters: ${num_clusters}
  n_init: 100
  random_state: ${random_state}
kmedians:
  n_clusters: ${num_clusters}
  n_init: 100
  random_state: ${random_state}
spectral_clustering:
  n_clusters: ${num_clusters}
  eigen_solver: lobpcg
  affinity: nearest_neighbors
  random_state: ${random_state}
ward:
  n_clusters: ${num_clusters}
  n_neighbors: 7
  linkage: ward
agglomerative:
  n_clusters: ${num_clusters}
  n_neighbors: 7
  metric: cosine
  linkage: average
dbscan:
  eps: 0.5
  min_samples: 5
hdbscan:
  min_samples: 10
  min_cluster_size: 20
optics:
  min_samples: 7
  xi: 0.05
  min_cluster_size: 0.4
birch:
  n_clusters: ${num_clusters}
  threshold: 0.2
gaussian:
  n_components: ${num_clusters}
  covariance_type: diag
  random_state: ${random_state}